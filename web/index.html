<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adobe Onboarding Assistant</title>

  <!-- Pre-paint theme resolver. Must run before any paint to avoid flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('adobe_theme');
        var isDark;
        if (stored === 'dark') isDark = true;
        else if (stored === 'light') isDark = false;
        else isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) { /* localStorage unavailable — safe to ignore */ }
    })();
  </script>

  <!-- Typography: Inter (UI) + JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind (utility layer) — configured before load -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Third-party runtime deps -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <!-- =====================================================================
       Global top bar — spans full width, above sidebar + main
  ====================================================================== -->
  <header class="app-header">
    <button type="button" class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="app-header-brand">
      <span class="app-header-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 240 234" xmlns="http://www.w3.org/2000/svg" aria-label="Adobe">
          <path fill="var(--accent-default)" d="M42.5 0h155L240 234h-57l-13-33H70.5l-13 33H0L42.5 0zm42 142h71l-35.5-89-35.5 89z"/>
        </svg>
      </span>
      <span class="app-header-title">Adobe Onboarding Assistant</span>
    </span>
    <div class="app-header-spacer"></div>
<div class="theme-toggle" id="theme-toggle" role="radiogroup" aria-label="Theme">
      <button type="button" data-theme="light" role="radio" aria-checked="false" aria-label="Light mode" title="Light">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
      <button type="button" data-theme="dark" role="radio" aria-checked="false" aria-label="Dark mode" title="Dark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-body">

    <!-- =====================================================================
         Sidebar
    ====================================================================== -->
    <aside class="sidebar" aria-label="Navigation">

      <button id="new-chat-btn" class="btn-new-chat" type="button">
        <span class="plus" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </span>
        <span>New chat</span>
      </button>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Recent</div>
        <nav class="sidebar-history" id="chat-history" aria-label="Recent chats">
          <button type="button" class="history-item active" title="Current conversation">Current conversation</button>
        </nav>
        <p class="sidebar-empty-hint">
          Past conversations will show up here once chat history is enabled.
        </p>
      </div>

      <div class="sidebar-section sidebar-section--footer">
        <div class="sidebar-section-label">Quick links</div>
        <nav class="sidebar-links" aria-label="Quick links">
          <a class="quick-link" href="https://wiki.corp.adobe.com/" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
            </span>
            <span>Wiki</span>
            <svg class="quick-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
          <a class="quick-link" href="https://git.corp.adobe.com/" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
              </svg>
            </span>
            <span>GitHub</span>
            <svg class="quick-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
          <a class="quick-link" href="https://jira.corp.adobe.com/" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
              </svg>
            </span>
            <span>Jira</span>
            <svg class="quick-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
          <a class="quick-link" href="https://adobe.slack.com/" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </span>
            <span>Slack</span>
            <svg class="quick-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
          <a class="quick-link" href="https://inside.corp.adobe.com/" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
              </svg>
            </span>
            <span>Inside Adobe</span>
            <svg class="quick-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
          <a class="quick-link" href="https://inside.corp.adobe.com/compensation-pay/payroll/india.html" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
              </svg>
            </span>
            <span>Payroll</span>
            <svg class="quick-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
            </svg>
          </a>
        </nav>
      </div>

    </aside>

    <!-- =====================================================================
         Main column
    ====================================================================== -->
    <main class="main-col" id="main-col">

      <div id="messages" role="log" aria-live="polite" aria-label="Conversation">
        <!-- Welcome hero / quiz / messages injected by app.js -->
      </div>

      <div class="composer-wrap">
        <!-- Floating pill: appears when scrolled away from the latest message.
             Anchored above the composer, not overlapping the chat stream. -->
        <button type="button" id="scroll-to-latest" class="scroll-to-latest" aria-label="Scroll to latest message">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
          <span>Latest</span>
        </button>
        <div class="composer-inner">
          <div id="followup-row" class="followup-row" hidden></div>
          <form id="chat-form">
            <div class="composer">
              <textarea id="input" rows="1" placeholder="Ask about onboarding, wiki pages, repos, architecture…" maxlength="4000"></textarea>
              <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"/>
                  <polyline points="5 12 12 5 19 12"/>
                </svg>
              </button>
            </div>
            <p class="composer-credit">Powered by Claude Opus</p>
          </form>
        </div>
      </div>

    </main>

  </div>

  <!-- Mobile sidebar backdrop (shown only when sidebar is open on narrow screens) -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

  <!-- =====================================================================
       Lightbox — used for expanded mermaid diagrams
  ====================================================================== -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Expanded diagram">
    <div class="lightbox-backdrop" data-lightbox-close></div>
    <div class="lightbox-frame">
      <div class="lightbox-toolbar">
        <button type="button" class="lightbox-btn" data-lightbox-action="zoom-out" aria-label="Zoom out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <span id="lightbox-zoom" class="lightbox-zoom">100%</span>
        <button type="button" class="lightbox-btn" data-lightbox-action="zoom-in" aria-label="Zoom in">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button type="button" class="lightbox-btn" data-lightbox-action="reset" aria-label="Reset zoom" title="Fit to screen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        </button>
        <span class="lightbox-spacer"></span>
        <button type="button" class="lightbox-btn" data-lightbox-close aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="lightbox-stage" class="lightbox-stage"></div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
